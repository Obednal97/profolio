# Profolio - full stack for local development and self-hosting.
#
#   cp .env.docker.example .env.docker
#   # edit .env.docker and set JWT_SECRET / API_ENCRYPTION_KEY
#   docker compose --env-file .env.docker up --build
#
# The application listens on http://localhost:3000. There is one service now:
# the NestJS backend was merged into the Next.js app, so there is no second
# container and no second port.
#
# Migrations are applied by the entrypoint on startup, so an empty volume comes
# up as a working system with no manual step.

name: profolio

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-profolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-profolio}
      POSTGRES_DB: ${POSTGRES_DB:-profolio}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Exposed on 5433 so it cannot collide with a Postgres already running
      # on the host's default 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      # The dbname is required, otherwise pg_isready reports ready before the
      # application database has actually been created on first boot.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-profolio} -d ${POSTGRES_DB:-profolio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT_HOST:-6380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Compile-time only: NEXT_PUBLIC_* values are inlined into the client
        # bundle, so changing one needs a rebuild.
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-local}
        NEXT_PUBLIC_ENABLE_DEMO_MODE: ${NEXT_PUBLIC_ENABLE_DEMO_MODE:-true}
        NEXT_PUBLIC_SHOW_LANDING_PAGE: ${NEXT_PUBLIC_SHOW_LANDING_PAGE:-true}
        NEXT_PUBLIC_ALLOW_REGISTRATION: ${NEXT_PUBLIC_ALLOW_REGISTRATION:-true}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-profolio}:${POSTGRES_PASSWORD:-profolio}@postgres:5432/${POSTGRES_DB:-profolio}
      # Migrations cannot run over a pooled connection, so prisma.config.ts
      # reads DIRECT_URL. Same host here; the two differ on Neon.
      DIRECT_URL: postgresql://${POSTGRES_USER:-profolio}:${POSTGRES_PASSWORD:-profolio}@postgres:5432/${POSTGRES_DB:-profolio}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # At least 32 characters - token signing refuses anything shorter.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must be at least 32 characters}
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:?API_ENCRYPTION_KEY is required}
      API_KEY_ENCRYPTION_SECRET: ${API_KEY_ENCRYPTION_SECRET:?API_KEY_ENCRYPTION_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # In-container updates are meaningless; images are replaced, not patched.
      DISABLE_UPDATES: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
